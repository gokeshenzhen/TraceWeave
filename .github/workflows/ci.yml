name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mcp==1.27.0" pyyaml pytest
          python -m pip freeze

      - name: Run tests
        run: |
          python -m pytest tests/ -v --ignore=tests/test_fsdb_parser.py --ignore=tests/test_fsdb_runtime.py

  source-graph-setup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and verify the pinned Source Graph runtime
        run: |
          bash scripts/setup_source_graph.sh
          bash scripts/setup_source_graph.sh --check
