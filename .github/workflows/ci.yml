name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,source-graph,fst]"
          python -m pip freeze

      - name: Run tests
        id: pytest
        run: |
          python -m pytest tests/ -v --ignore=tests/test_fsdb_parser.py --ignore=tests/test_fsdb_runtime.py \
            --tw-report "$RUNNER_TEMP/traceweave-pytest.json"

      - name: Annotate regression failures
        if: failure() && steps.pytest.conclusion == 'failure'
        run: |
          python - "$RUNNER_TEMP/traceweave-pytest.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          report_path = Path(sys.argv[1])
          if not report_path.is_file():
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          details = {
              f"Failed {item['nodeid']}"
              for item in report["outcomes"] if item["outcome"] == "failed"
          }
          details.update(f"Collection {item['outcome']} {item['nodeid']}" for item in report["collection_issues"])
          details.update(f"Unexpected skip {item['nodeid']}" for item in report["unexpected_skips"])
          if details:
              summary = "\n".join(sorted(details)[:10])
              message = summary.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=TraceWeave portable regression::{message}")
          PY

  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Clean-install and smoke-test wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/traceweave-clean"
          "$RUNNER_TEMP/traceweave-clean/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/traceweave-clean/bin/python" -c \
            'import importlib.metadata, importlib.util, traceweave_mcp; assert importlib.metadata.version("traceweave-mcp") == traceweave_mcp.__version__; assert all(importlib.util.find_spec(name) is None for name in ("server", "config", "src")); assert importlib.util.find_spec("traceweave_mcp._runtime.server") is not None'
          timeout 30 "$RUNNER_TEMP/traceweave-clean/bin/python" \
            "$GITHUB_WORKSPACE/tests/installed_stdio_smoke.py"

      - name: Smoke-test the installed Source Graph extra
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          wheels=(dist/*.whl)
          "$RUNNER_TEMP/traceweave-clean/bin/python" -m pip install \
            "${wheels[0]}[source-graph]"
          cd "$RUNNER_TEMP"
          timeout 30 "$RUNNER_TEMP/traceweave-clean/bin/python" \
            "$GITHUB_WORKSPACE/tests/installed_source_graph_smoke.py"

      - name: Smoke-test the installed FST extra
        shell: bash
        run: |
          wheels=(dist/*.whl)
          "$RUNNER_TEMP/traceweave-clean/bin/python" -m pip install \
            "${wheels[0]}[fst,source-graph]"
          cd "$RUNNER_TEMP"
          timeout 180 "$RUNNER_TEMP/traceweave-clean/bin/python" \
            "$GITHUB_WORKSPACE/scripts/check_fst_readback.py" --installed \
            --output "$RUNNER_TEMP/fst-readback.json"

  source-graph-setup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install and verify the pinned Source Graph runtime
        run: |
          bash scripts/setup_source_graph.sh
          bash scripts/setup_source_graph.sh --check
