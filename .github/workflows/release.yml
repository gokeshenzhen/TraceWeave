name: Finish TraceWeave 2.1.1 release

on:
  push:
    tags:
      - "v2.1.1-publish"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TRACEWEAVE_RELEASE_TAG: "v2.1.1"
  TRACEWEAVE_RELEASE_COMMIT: "e6db90963f31d28c52e497c8a07f31c13847ad81"

jobs:
  verify-ci:
    if: github.repository == 'gokeshenzhen/TraceWeave'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TRACEWEAVE_CI_RUN: '45147350732'
    steps:
      - name: Verify CI for the tagged commit
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.error import URLError
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          commit = os.environ['TRACEWEAVE_RELEASE_COMMIT']
          tag = os.environ['TRACEWEAVE_RELEASE_TAG']
          run_id = os.environ['TRACEWEAVE_CI_RUN']
          base = f'https://api.github.com/repos/{repo}'
          headers = {'Accept':'application/vnd.github+json', 'Cache-Control':'no-cache',
                     'Authorization':f"Bearer {os.environ['GH_TOKEN']}"}

          def get(path):
              with urlopen(Request(base + path, headers=headers),timeout=12) as response:
                  return json.load(response)

          assert get(f'/commits/{tag}')['sha'] == commit
          path = f'/actions/runs/{run_id}'
          expected = {'test (3.11)', 'test (3.12)', 'package (3.11)', 'package (3.12)', 'source-graph-setup'}
          for attempt in range(30):
              try:
                  run = get(path)
                  assert run['head_sha'] == commit and run['head_branch'] == 'main'
                  assert run['event'] == 'push' and run['name'] == 'CI'
                  if run['status'] == 'completed':
                      assert run['conclusion'] == 'success', run['conclusion']
                      jobs = get(path + '/jobs?per_page=20&filter=latest')['jobs']
                      passed = {job['name'] for job in jobs if job['conclusion'] == 'success'}
                      if expected <= passed:
                          print(f'CI run {run_id} passed for {commit}.')
                          break
              except (URLError, TimeoutError):
                  if attempt == 29:
                      raise
              time.sleep(12)
          else:
              raise SystemExit('CI for the tagged commit did not complete successfully.')
          PY

  build:
    if: github.repository == 'gokeshenzhen/TraceWeave'
    needs: verify-ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TRACEWEAVE_RELEASE_COMMIT }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify tag and release metadata
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import tomllib

          root = Path.cwd()
          project = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))["project"]
          registry = json.loads((root / "server.json").read_text(encoding="utf-8"))
          version_scope = {}
          exec((root / "traceweave_mcp" / "__init__.py").read_text(encoding="utf-8"), version_scope)

          version = project["version"]
          # The Registry ranks full SemVer server versions ahead of shortened ones.
          registry_version = f"{version}.0" if re.fullmatch(r"[0-9]+\.[0-9]+", version) else version
          expected_tag = f"v{version}"
          actual_tag = os.environ["TRACEWEAVE_RELEASE_TAG"]
          package = registry["packages"][0]
          marker = "<!-- mcp-name: io.github.gokeshenzhen/traceweave -->"

          assert actual_tag == expected_tag, f"tag {actual_tag!r} must equal {expected_tag!r}"
          assert project["name"] == "traceweave-mcp"
          assert version_scope["__version__"] == version
          assert registry["name"] == "io.github.gokeshenzhen/traceweave"
          assert registry["version"] == registry_version
          assert package["registryType"] == "pypi"
          assert package["identifier"] == project["name"]
          assert package["version"] == version
          assert marker in (root / "README.md").read_text(encoding="utf-8")
          print(f"release metadata is consistent for {actual_tag}")
          PY

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Verify wheel namespace
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              top_level_name = next(name for name in names if name.endswith(".dist-info/top_level.txt"))
              top_levels = wheel.read(top_level_name).decode("utf-8").splitlines()
          with open_tar(sdists[0], "r:gz") as sdist:
              sdist_names = {member.name for member in sdist.getmembers()}

          assert top_levels == ["traceweave_mcp"], top_levels
          assert "server.py" not in names
          assert "config.py" not in names
          assert not any(name.startswith("src/") for name in names)
          assert "traceweave_mcp/_runtime/server.py" in names
          assert "traceweave_mcp/_runtime/config.py" in names
          assert "traceweave_mcp/_runtime/src/__init__.py" in names
          assert "traceweave_mcp/doctor.py" in names

          forbidden_basenames = {
              "fsdb_wrapper.cpp",
              "fsdb_point_read.h",
              "build_wrapper.sh",
              "setup_fsdb.sh",
              "verify_fsdb.sh",
              "install.sh",
              "libfsdb_wrapper.so",
          }
          assert not any(Path(name).name in forbidden_basenames for name in names)
          assert not any(Path(name).name in forbidden_basenames for name in sdist_names)
          assert not any("/scripts/" in name or "/tests/" in name or "/native/" in name for name in sdist_names)
          assert not any(name.endswith((".so", ".pyc")) for name in names)
          assert not any(name.endswith((".so", ".pyc")) for name in sdist_names)
          print(
              f"{wheels[0].name}: isolated traceweave_mcp namespace; "
              "portable artifacts contain no FSDB build/runtime payload"
          )
          PY

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  package-smoke:
    if: github.repository == 'gokeshenzhen/TraceWeave'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TRACEWEAVE_RELEASE_COMMIT }}
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Clean-install and smoke-test wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/traceweave-clean"
          "$RUNNER_TEMP/traceweave-clean/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          timeout 30 "$RUNNER_TEMP/traceweave-clean/bin/python" \
            "$GITHUB_WORKSPACE/tests/installed_stdio_smoke.py"

      - name: Smoke-test the installed Source Graph extra
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          wheels=(dist/*.whl)
          "$RUNNER_TEMP/traceweave-clean/bin/python" -m pip install \
            "${wheels[0]}[source-graph]"
          cd "$RUNNER_TEMP"
          timeout 30 "$RUNNER_TEMP/traceweave-clean/bin/python" \
            "$GITHUB_WORKSPACE/tests/installed_source_graph_smoke.py"

  publish-pypi:
    if: github.repository == 'gokeshenzhen/TraceWeave'
    needs: package-smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/traceweave-mcp
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    if: github.repository == 'gokeshenzhen/TraceWeave'
    needs: publish-pypi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TRACEWEAVE_RELEASE_COMMIT }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Wait for and verify public PyPI metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import time
          import tomllib
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          root = Path.cwd()
          project = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))["project"]
          name = project["name"]
          version = project["version"]
          url = f"https://pypi.org/pypi/{name}/{version}/json"
          marker = "<!-- mcp-name: io.github.gokeshenzhen/traceweave -->"
          last_error = "not queried"

          for attempt in range(1, 25):
              try:
                  request = Request(url, headers={"Accept": "application/json"})
                  with urlopen(request, timeout=20) as response:
                      payload = json.load(response)
                  if payload["info"]["version"] == version:
                      break
                  last_error = f"unexpected version {payload['info']['version']!r}"
              except (HTTPError, URLError, TimeoutError, KeyError, ValueError) as exc:
                  last_error = str(exc)
              if attempt < 24:
                  time.sleep(10)
          else:
              raise SystemExit(f"PyPI metadata did not become readable: {last_error}")

          filenames = {item["filename"] for item in payload["urls"]}
          assert marker in payload["info"]["description"]
          assert any(filename.endswith("-py3-none-any.whl") for filename in filenames)
          assert any(filename.endswith(".tar.gz") for filename in filenames)
          print(json.dumps({"name": name, "version": version, "files": sorted(filenames)}, indent=2))
          PY

      - name: Clean-install and smoke-test the public wheel
        shell: bash
        run: |
          VERSION="${TRACEWEAVE_RELEASE_TAG#v}"
          python -m venv "$RUNNER_TEMP/traceweave-public"
          "$RUNNER_TEMP/traceweave-public/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/traceweave-public/bin/python" -m pip install \
            --no-cache-dir --index-url https://pypi.org/simple --retries 12 \
            "traceweave-mcp==$VERSION"
          cd "$RUNNER_TEMP"
          timeout 30 "$RUNNER_TEMP/traceweave-public/bin/python" \
            "$GITHUB_WORKSPACE/tests/installed_stdio_smoke.py"

  publish-registry:
    if: github.repository == 'gokeshenzhen/TraceWeave'
    needs: verify-pypi
    runs-on: ubuntu-latest
    environment:
      name: mcp-registry
      url: https://registry.modelcontextprotocol.io
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: "1.8.1"
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TRACEWEAVE_RELEASE_COMMIT }}
          persist-credentials: false

      - name: Install the pinned current mcp-publisher
        shell: bash
        run: |
          archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" --version

      - name: Validate Registry metadata
        run: '"$RUNNER_TEMP/mcp-publisher" validate server.json'

      - name: Authenticate with GitHub Actions OIDC
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'

      - name: Publish to the Official MCP Registry
        run: '"$RUNNER_TEMP/mcp-publisher" publish server.json'

  verify-registry:
    if: github.repository == 'gokeshenzhen/TraceWeave'
    needs: publish-registry
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TRACEWEAVE_RELEASE_COMMIT }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Query exact latest and search endpoints
        run: |
          curl --fail --silent --show-error --location \
            --retry 30 --retry-all-errors --retry-delay 10 \
            'https://registry.modelcontextprotocol.io/v0.1/servers/io.github.gokeshenzhen%2Ftraceweave/versions/latest' \
            --output registry-latest.json
          curl --fail --silent --show-error --location \
            --retry 30 --retry-all-errors --retry-delay 10 \
            'https://registry.modelcontextprotocol.io/v0.1/servers?search=traceweave&version=latest' \
            --output registry-search.json

      - name: Verify Registry response metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd()
          registry = json.loads((root / "server.json").read_text(encoding="utf-8"))
          version = registry["version"]
          package_version = registry["packages"][0]["version"]
          expected_name = "io.github.gokeshenzhen/traceweave"
          expected_package = "traceweave-mcp"
          expected_repository = "https://github.com/gokeshenzhen/TraceWeave"

          latest = json.loads((root / "registry-latest.json").read_text(encoding="utf-8"))
          server = latest["server"]
          packages = server["packages"]
          assert server["name"] == expected_name
          assert server["version"] == version
          assert server["repository"]["url"] == expected_repository
          assert any(
              package["registryType"] == "pypi"
              and package["identifier"] == expected_package
              and package["version"] == package_version
              and package["transport"]["type"] == "stdio"
              for package in packages
          )

          search = json.loads((root / "registry-search.json").read_text(encoding="utf-8"))
          matches = [
              item["server"]
              for item in search["servers"]
              if item.get("server", {}).get("name") == expected_name
          ]
          assert any(match["version"] == version for match in matches)
          print(json.dumps({
              "name": server["name"],
              "version": server["version"],
              "package": expected_package,
              "repository": server["repository"]["url"],
              "search_matches": len(matches),
          }, indent=2))
          PY

      - name: Store Registry verification responses
        uses: actions/upload-artifact@v5
        with:
          name: registry-verification
          path: registry-*.json
          if-no-files-found: error
          retention-days: 30

  github-release:
    if: github.repository == 'gokeshenzhen/TraceWeave'
    needs: verify-registry
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$TRACEWEAVE_RELEASE_TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "TraceWeave ${TRACEWEAVE_RELEASE_TAG#v}"
          --generate-notes
